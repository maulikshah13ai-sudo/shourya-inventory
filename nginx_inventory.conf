# Nginx Reverse Proxy Configuration (Optional - For Custom Domain with SSL)
# Place this in /etc/nginx/sites-available/inventory and enable it.

server {
    listen 80;
    server_name your-domain.com; # Replace with your domain name or server IP

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
